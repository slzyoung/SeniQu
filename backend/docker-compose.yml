# ============================================
# SENIQU BACKEND - Docker Compose
# For local testing & Tencent Cloud deployment
# ============================================
version: '3.8'

services:
  seniqu-backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: seniqu-backend
    restart: unless-stopped
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    env_file:
      - .env.tencent
    volumes:
      - ./private.pem:/app/private.pem:ro
      - ./public.pem:/app/public.pem:ro
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-3001}
      - NODE_OPTIONS=--max-old-space-size=512
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:${PORT:-3001}/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024M
          cpus: '1.0'
        reservations:
          memory: 256M
          cpus: '0.25'
