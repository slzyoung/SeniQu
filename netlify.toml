[build]
  base = "/"
  publish = "frontend/dist"
  command = "npm run build:frontend"

[build.environment]
  NODE_OPTIONS = "--max-old-space-size=4096"
  NPM_FLAGS = "--legacy-peer-deps"

# Domain Aliasing - Redirect netlify subdomain to custom domain (HTTP)
[[redirects]]
  from = "http://seniquapp.netlify.app/*"
  to = "https://seniqu.art/:splat"
  status = 301
  force = true

# Domain Aliasing - Redirect netlify subdomain to custom domain (HTTPS)
[[redirects]]
  from = "https://seniquapp.netlify.app/*"
  to = "https://seniqu.art/:splat"
  status = 301
  force = true

# SPA Routing — All paths serve index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ============================================
# Security Headers (OWASP — Anti-Hacking)
# ============================================
[[headers]]
  for = "/*"
  [headers.values]
    # X-Frame-Options removed — frame-ancestors in CSP is the modern replacement
    # Having both can cause conflicts where browsers block legitimate iframes
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(), usb=()"
    X-Permitted-Cross-Domain-Policies = "none"
    X-Download-Options = "noopen"
    Content-Security-Policy = "frame-ancestors 'self' https://auth.privy.io https://*.privy.io https://seniquapp.netlify.app https://seniqu.art https://seniqu.com; default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://challenges.cloudflare.com https://static.cloudflareinsights.com https://auth.privy.io https://*.privy.io https://maps.googleapis.com https://maps.google.com https://sdk.scdn.co; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https: http:; font-src 'self' https://fonts.gstatic.com data:; media-src 'self' blob: https://cdn.seniqu.art https://*.seniqu.art https://seniqu.art; connect-src 'self' https://*.r2.cloudflarestorage.com https://challenges.cloudflare.com https://cloudflareinsights.com https://api.seniqu.art https://auth.privy.io https://*.privy.io https://maps.googleapis.com https://rpc.ankr.com https://api.devnet.solana.com https://*.solana.com https://images.unsplash.com https://*.unsplash.com https://upload.wikimedia.org https://fonts.googleapis.com https://fonts.gstatic.com wss://*.walletconnect.com wss://*.walletconnect.org https://*.walletconnect.com https://*.walletconnect.org https://*.reown.com https://api.web3modal.org https://min-api.cryptocompare.com https://api.coingecko.com wss://stream.binance.com https://accounts.spotify.com https://api.spotify.com; frame-src 'self' https://challenges.cloudflare.com https://auth.privy.io https://*.privy.io https://sdk.scdn.co https://*.spotify.com; object-src 'none'; base-uri 'self'; form-action 'self';"

# ============================================
# Static Asset Caching (Anti-Chunking / Performance)
# ============================================
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
