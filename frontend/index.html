  <!-- Console Noise Suppression (Must be first to capture early logs/lockdowns) -->
  <script>
    (function () {
      const suppressPatterns = [
        'SES Removing unpermitted intrinsics',
        'SES ',
        'lockdown-install',
        'lockdown',
        'MaxListenersExceededWarning',
        'Removing unpermitted intrinsics',
        'ses.cjs',
        'ses.umd',
      ];
      const shouldSuppress = (args) => {
        const msg = args.map(a => {
          try {
            return String(a);
          } catch(e) {
            return '';
          }
        }).join(' ');
        return suppressPatterns.some(p => msg.includes(p));
      };

      const wrapConsole = (method) => {
        let realMethod = console[method];
        Object.defineProperty(console, method, {
          get() {
            return function (...args) {
              if (!shouldSuppress(args)) {
                if (typeof realMethod === 'function') {
                  realMethod.apply(console, args);
                }
              }
            };
          },
          set(newMethod) {
            realMethod = newMethod;
          },
          configurable: true,
          enumerable: true
        });
      };

      ['log', 'warn', 'error', 'info', 'debug'].forEach(wrapConsole);
    })();
  </script>
